name: Daily Space Fact Sender

on:
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * *"
    - cron: "30 6 * * *"
    - cron: "30 10 * * *"
    - cron: "30 12 * * *"
    - cron: "30 15 * * *"

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repo
        uses: actions/checkout@v4   # ✅ upgraded

      - name: ☕ Set up Java 21
        uses: actions/setup-java@v4  # ✅ upgraded
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 📦 Build Project
        run: javac -cp "libs/*" src/*.java -d out

      - name: 🚀 Run App
        run: java -cp "libs/*:out" Main
        env:
          API_KEY: ${{ secrets.API_KEY }}
          APP_PASSWD: ${{ secrets.APP_PASSWD }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
